      // Performance monitoring
      window.addEventListener("load", () => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => console.log("SW registered:", registration))
            .catch((error) => console.log("SW registration failed:", error));
        }

        // Track Core Web Vitals

  <body>
    <!-- Skip Links for Accessibility -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-0 focus:left-0 bg-blue-600 text-white p-2 z-50"
    >
      Skip to main content
    </a>

    <!-- No Script Fallback -->
    <noscript>
      <div style="text-align: center; padding: 2rem; font-family: system-ui">
        <h1>JavaScript Required</h1>
        <p>
          Local SEO Ranker requires JavaScript to function properly. Please
          enable JavaScript in your browser settings.
        </p>
      </div>
    </noscript>

    <!-- Main App Container -->
    <div id="root"></div>

    <!-- App Script -->
    <script type="module" src="/client/main.tsx"></script>

    <!-- Service Worker Update Handler -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.addEventListener("message", (event) => {
          if (event.data && event.data.type === "SW_UPDATE_AVAILABLE") {
            // Handle service worker updates
            if (confirm("New version available! Reload to update?")) {
              window.location.reload();
            }
          }
        });
      }
    </script>
  </body>
