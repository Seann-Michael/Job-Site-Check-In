<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary Meta Tags -->
    <title>Local SEO Ranker</title>
    <meta name="title" content="Local SEO Ranker" />
    <meta
      name="description"
      content="Local SEO Ranker - Google Business Profile optimization, review management and local rank tracking for service businesses."
    />
    <meta
      name="keywords"
      content="local SEO, Google Business Profile, GMB, reviews, rank tracking"
    />
    <meta name="author" content="Local SEO Ranker Team" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="language" content="English" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://localseoranker.com/" />
    <meta property="og:title" content="Local SEO Ranker" />
    <meta
      property="og:description"
      content="Google Business Profile optimization, review management and local rank tracking."
    />
    <meta property="og:image" content="/icon-512x512.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://localseoranker.com/" />
    <meta property="twitter:title" content="Local SEO Ranker" />
    <meta
      property="twitter:description"
      content="Google Business Profile optimization, review management and local rank tracking."
    />
    <meta property="twitter:image" content="/icon-512x512.png" />

    <!-- Enhanced PWA Meta Tags -->
    <meta name="application-name" content="Local SEO Ranker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Local SEO Ranker" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#2563eb"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1e40af"
    />

    <!-- Advanced PWA Features -->
    <meta name="apple-mobile-web-app-orientation" content="portrait" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="mobile-web-app-title" content="Local SEO Ranker" />
    <meta name="msapplication-navbutton-color" content="#2563eb" />
    <meta name="msapplication-starturl" content="/admin/jobs" />
    <meta name="msapplication-window" content="width=1024;height=768" />

    <!-- Permissions Policy -->
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(self), notifications=(self)"
    />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon-base.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon-base.svg" color="#2563eb" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Security Headers -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://maps.googleapis.com https://maps.gstatic.com https://*.ggpht.com https://*.supabase.co https://*.supabase.in; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob: https://maps.googleapis.com https://*.supabase.co https://*.supabase.in wss://*.supabase.co wss://*.supabase.in https://api.stripe.com https://*.ingest.sentry.io https://*.sentry.io; media-src 'self' blob: https://*.supabase.co; object-src 'none'; frame-src https://www.google.com https://maps.google.com https://js.stripe.com https://www.youtube.com https://www.youtube-nocookie.com;"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />

    <!-- Accessibility -->
    <meta name="color-scheme" content="light dark" />

    <!-- Service worker registration (production only) -->
    <script>
      window.APP_BUILD_ID = "__BUILD_ID__";
      window.addEventListener("load", () => {
        if (!("serviceWorker" in navigator)) return;
        if (
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1"
        )
          return;
        navigator.serviceWorker
          .register("/sw.js")
          .catch((error) => console.warn("SW registration failed:", error));
      });
    </script>
  </head>

  <body>
    <!-- Skip Links for Accessibility -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-0 focus:left-0 bg-blue-600 text-white p-2 z-50"
    >
      Skip to main content
    </a>

    <!-- No Script Fallback -->
    <noscript>
      <div style="text-align: center; padding: 2rem; font-family: system-ui">
        <h1>JavaScript Required</h1>
        <p>
          Local SEO Ranker requires JavaScript to function properly. Please
          enable JavaScript in your browser settings.
        </p>
      </div>
    </noscript>

    <!-- Main App Container -->
    <div id="root"></div>

    <!-- App Script -->
    <script type="module" src="/client/main.tsx"></script>

    <!-- Service Worker Update Handler -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.addEventListener("message", (event) => {
          if (event.data && event.data.type === "SW_UPDATE_AVAILABLE") {
            // Handle service worker updates
            if (confirm("New version available! Reload to update?")) {
              window.location.reload();
            }
          }
        });
      }
    </script>
  </body>
</html>
