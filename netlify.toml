[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  # Supabase Configuration (Set these in Netlify dashboard)
  SUPABASE_URL = ""
  SUPABASE_SERVICE_ROLE_KEY = ""
  SUPABASE_STORAGE_BUCKET = "media"

  # Google Maps API (Set in Netlify dashboard)
  VITE_GOOGLE_MAPS_API_KEY = ""

  # Twilio SMS Configuration (Set these in Netlify dashboard when available)
  TWILIO_ACCOUNT_SID = ""
  TWILIO_AUTH_TOKEN = ""
  TWILIO_PHONE_NUMBER = ""

  # Mailgun Email Configuration (Set in Netlify dashboard)
  MAILGUN_API_KEY = ""
  MAILGUN_DOMAIN = "mg.localcontractorleads.com"
  FROM_EMAIL = "noreply@localcontractorleads.com"

  # DataForSEO API Configuration (Set in Netlify dashboard)
  DATAFORSEO_API_LOGIN = ""
  DATAFORSEO_API_PASSWORD = ""

  # OpenAI API Configuration (Set in Netlify dashboard)
  OPENAI_API_KEY = ""

  # Disable secrets scanning for client-side Google Maps API key
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  external_node_modules = ["express", "serverless-http"]
  node_bundler = "esbuild"

[[redirects]]
  force = true
  from = "/api/oauth/custom-platforms"
  status = 200
  to = "/.netlify/functions/custom-platforms"

[[redirects]]
  force = true
  from = "/api/oauth/agency-config/*"
  status = 200
  to = "/.netlify/functions/agency-config/:splat"

[[redirects]]
  force = true
  from = "/api/oauth/client-onboard"
