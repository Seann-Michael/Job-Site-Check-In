<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Docs - Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@4/swagger-ui.css" />
  <style>body { margin:0; padding:0; }</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@4/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        dom_id: '#swagger-ui',
        urls: [
          { name: 'Onboarding', url: '/docs/api/onboarding.openapi.yaml' },
          { name: 'OAuth', url: '/docs/api/oauth.openapi.yaml' },
          { name: 'Payments', url: '/docs/api/payments.openapi.yaml' },
          { name: 'Webhooks', url: '/docs/api/webhooks.openapi.yaml' }
        ],
        presets: [
          SwaggerUIBundle.presets.apis,
        ],
        layout: 'BaseLayout',
        docExpansion: 'none'
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
