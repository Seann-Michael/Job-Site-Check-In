openapi: 3.0.3
info:
  title: Webhooks API (Payments)
  version: 1.0.0
  description: |
    Public webhook endpoints for payment providers. These endpoints receive events from Stripe, PayPal and Coinbase Commerce and must verify signatures. They accept POST requests with provider-specific payloads.
servers:
  - url: https://{site_url}
    variables:
      site_url:
        default: example.com
paths:
  /api/webhook-stripe:
    post:
      summary: Stripe webhook receiver
      description: Verifies Stripe signature (Stripe-Signature header) and persists payment/invoice events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Received
  /api/webhook-paypal:
    post:
      summary: PayPal webhook receiver
      description: Verifies PayPal webhook via verify-webhook-signature and persists events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Received
  /api/webhook-coinbase:
    post:
      summary: Coinbase Commerce webhook receiver
      description: Verifies HMAC signature using COINBASE_COMMERCE_SHARED_SECRET and persists events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Received
components:
  securitySchemes: {}
tags:
  - name: webhooks
    description: Payment provider webhook endpoints

security: []

x-notes: |
  - Ensure each provider's webhook signing secret is configured in environment variables.
  - Webhook endpoints are implemented in netlify/functions/webhook-stripe.ts, webhook-paypal.ts, webhook-coinbase.ts.
  - Configure provider dashboard to point to: <SITE_URL>/api/webhook-<provider> (or the Netlify functions path if redirects are used).
