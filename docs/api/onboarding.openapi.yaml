openapi: 3.0.3
info:
  title: Onboarding API
  version: 1.0.0
  description: |
    Internal onboarding API used by the frontend and server functions to manage onboarding tasks, progress and token awards.
servers:
  - url: https://{site_url}
    variables:
      site_url:
        default: example.com
paths:
  /.netlify/functions/onboarding-api:
    get:
      summary: Get onboarding tasks and user progress
      description: Returns list of tasks, per-user progress and overall completion percentage.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [tasks]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      tasks:
                        type: array
                        items:
                          $ref: '#/components/schemas/OnboardingTaskWithProgress'
                      progressPercent:
                        type: integer
                      next:
                        $ref: '#/components/schemas/OnboardingTaskWithProgress'
    post:
      summary: Complete or update a task
      description: Mark a task complete or skipped; awards tokens when applicable.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [complete]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: string
                status:
                  type: string
                  enum: [completed, in_progress, skipped, not_started]
                skip_reason:
                  type: string
              required: [task_id]
      responses:
        '200':
          description: Updated progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  progressPercent:
                    type: integer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OnboardingTask:
      type: object
      properties:
        id:
          type: string
        task_name:
          type: string
        category:
          type: string
        description:
          type: string
        token_reward:
          type: integer
        required:
          type: boolean
        order_sequence:
          type: integer
        estimated_time:
          type: integer
    OnboardingTaskProgress:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        task_id:
          type: string
        status:
          type: string
        completed_at:
          type: string
          format: date-time
        tokens_awarded:
          type: integer
    OnboardingTaskWithProgress:
      allOf:
        - $ref: '#/components/schemas/OnboardingTask'
        - type: object
          properties:
            progress:
              $ref: '#/components/schemas/OnboardingTaskProgress'
  security:
    - bearerAuth: []

tags:
  - name: onboarding
    description: Onboarding tasks and progress
