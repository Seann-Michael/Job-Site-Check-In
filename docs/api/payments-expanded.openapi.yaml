openapi: 3.0.3
info:
  title: Payments API (Expanded)
  version: 1.1.0
  description: Detailed request/response examples and webhook payload schemas for Stripe, PayPal and Coinbase Commerce.
servers:
  - url: https://{site_url}
    variables:
      site_url:
        default: example.com
paths:
  /.netlify/functions/create-checkout-stripe:
    post:
      summary: Create a Stripe Checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                mode:
                  type: string
                  enum: [one_time, subscription]
                description:
                  type: string
                metadata:
                  type: object
              required: [amount]
            example:
              amount: 49.99
              mode: one_time
              description: "Pro subscription trial"
              metadata:
                user_id: "f97a3e..."
      responses:
        '200':
          description: Checkout URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
              example:
                url: "https://checkout.stripe.com/pay/cs_test_..."

  /.netlify/functions/create-checkout-paypal:
    post:
      summary: Create a PayPal order or subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                mode:
                  type: string
                  enum: [one_time, subscription]
                description:
                  type: string
                metadata:
                  type: object
              required: [amount]
            example:
              amount: 49.99
              mode: one_time
              description: "Agency onboarding fee"
              metadata:
                user_id: "f97a3e..."
      responses:
        '200':
          description: PayPal approval/approve link
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
              example:
                url: "https://www.paypal.com/checkoutnow?token=..."

  /.netlify/functions/create-checkout-coinbase:
    post:
      summary: Create a Coinbase Commerce charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                description:
                  type: string
                metadata:
                  type: object
              required: [amount]
            example:
              amount: 19.99
              description: "One-time credits pack"
              metadata:
                user_id: "f97a3e..."
      responses:
        '200':
          description: Hosted charge URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
              example:
                url: "https://commerce.coinbase.com/charges/abcd-1234"

  /api/webhook-stripe:
    post:
      summary: Stripe webhook receiver (example schemas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent'
      responses:
        '200':
          description: Received

  /api/webhook-paypal:
    post:
      summary: PayPal webhook receiver (example schemas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayPalWebhook'
      responses:
        '200':
          description: Received

  /api/webhook-coinbase:
    post:
      summary: Coinbase Commerce webhook receiver (example schemas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoinbaseWebhook'
      responses:
        '200':
          description: Received

components:
  schemas:
    StripeEvent:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        type:
          type: string
        data:
          type: object
      example:
        id: evt_1JXXXXXX
        object: event
        type: checkout.session.completed
        data:
          object:
            id: cs_test_a1b2c3
            object: checkout.session
            amount_total: 4999
            currency: usd
            metadata:
              user_id: "f97a3e..."

    StripeInvoicePaidEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
      example:
        id: evt_1IZYYYYY
        type: invoice.paid
        data:
          object:
            id: in_1AbC
            amount_paid: 1999
            currency: usd
            subscription: sub_1AbC

    PayPalWebhook:
      type: object
      properties:
        id:
          type: string
        event_type:
          type: string
        resource:
          type: object
      examples:
        payment_capture_completed:
          summary: PAYMENT.CAPTURE.COMPLETED example
          value:
            id: WH-1ABCD
            event_type: PAYMENT.CAPTURE.COMPLETED
            resource:
              id: 2GG12345
              amount:
                value: "49.99"
                currency_code: "USD"
              payer:
                payer_id: "ABCXYZ"
        subscription_activated:
          summary: BILLING.SUBSCRIPTION.ACTIVATED example
          value:
            id: WH-2SUBS
            event_type: BILLING.SUBSCRIPTION.ACTIVATED
            resource:
              id: I-XXXXXX
              status: ACTIVE
              plan_id: P-XXXX
              subscriber:
                payer_id: "ABCXYZ"

    CoinbaseWebhook:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
      example:
        id: f1a2b3c4-d5e6
        type: charge:confirmed
        data:
          id: 3f2a1b
          code: abc123
          name: "One-time credits"
          pricing:
            local:
              amount: "19.99"
              currency: "USD"

security: []

tags:
  - name: payments
    description: Payment creation and webhook examples
